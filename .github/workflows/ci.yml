name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Automated checks (SQL lessons, pipeline, datasets, ML, LLM, grader)
        run: npm test
      - name: Type-check and production build
        run: npm run build
